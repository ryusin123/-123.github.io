name: Update Posts

on:
  push:
    paths:
      - 'img/**'
      - '.github/workflows/update-posts.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate posts.json
        run: |
          python <<EOF
          import os
          import json
          from datetime import datetime, timedelta, timezone

          root = "img"
          posts_map = {}

          today = datetime.now(timezone(timedelta(hours=9))).strftime("%Y-%m-%d")

          if os.path.exists(root):
              for item in sorted(os.listdir(root)):
                  path = os.path.join(root, item)

                  if os.path.isfile(path):
                      lower = item.lower()
                      if lower.endswith((".jpg", ".jpeg", ".png", ".webp", ".gif")):
                          posts_map.setdefault(today, []).append(f"img/{item}")

                  if os.path.isdir(path):
                      date = item
                      for file in sorted(os.listdir(path)):
                          lower = file.lower()
                          if lower.endswith((".jpg", ".jpeg", ".png", ".webp", ".gif")):
                              posts_map.setdefault(date, []).append(f"img/{date}/{file}")

          posts = []

          for date in sorted(posts_map.keys(), reverse=True):
              posts.append({
                  "date": date,
                  "count": len(posts_map[date]),
                  "images": posts_map[date]
              })

          with open("posts.json", "w", encoding="utf-8") as f:
              json.dump(posts, f, ensure_ascii=False, indent=2)
          EOF

      - name: Commit posts.json
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"

          git add posts.json

          git diff --cached --quiet || (
            git commit -m "auto update posts"
            git push
          )
