<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>趣味2号 日付ログ</title>

<style>
body{background:#0b0b0b;color:white;margin:0;font-family:sans-serif;}
header{background:#000;text-align:center;padding:40px 20px;font-size:48px;font-weight:bold;border-bottom:2px solid #222;}
.top-area{text-align:center;padding:20px;}
.top-area a{display:inline-block;background:#222;color:white;text-decoration:none;padding:12px 24px;border-radius:10px;font-size:20px;margin:6px;}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:26px;max-width:1500px;margin:0 auto;padding:30px;}
.card{background:#1b1b1b;border-radius:12px;overflow:hidden;box-shadow:0 0 12px rgba(0,0,0,0.5);}
.card img{width:100%;height:430px;object-fit:cover;object-position:center top;display:block;}
.card-body{padding:14px;}
.card-title{font-size:22px;font-weight:bold;}
.pagination{text-align:center;padding:30px 20px 70px;}
.pagination a{display:inline-block;background:#222;color:white;text-decoration:none;padding:12px 20px;margin:6px;border-radius:8px;font-size:20px;}
.pagination .current{background:#555;}
</style>
</head>

<body>

<header id="pageTitle">煩悩ログ</header>

<div class="top-area">
<a href="index.html">トップに戻る</a>
</div>

<div class="gallery" id="gallery"></div>

<div class="pagination" id="pagination"></div>

<script>
const PER_PAGE = 50;

const params = new URLSearchParams(window.location.search);
const date = params.get("date");
const currentPage = Number(params.get("page") || 1);

document.getElementById("pageTitle").innerText = date + " 煩悩ログ";

fetch("posts.json")
.then(response => response.json())
.then(posts => {
const target = posts.find(p => p.date === date);
if(!target) return;

const images = target.images;
const totalPages = Math.ceil(images.length / PER_PAGE);
const start = (currentPage - 1) * PER_PAGE;
const end = start + PER_PAGE;
const pageImages = images.slice(start,end);

const gallery = document.getElementById("gallery");

pageImages.forEach((img,index) => {
gallery.innerHTML += `
<div class="card">
<img src="${img}">
<div class="card-body">
<div class="card-title">今日の煩悩 ${start + index + 1}</div>
</div>
</div>
`;
});

const pagination = document.getElementById("pagination");

if(totalPages > 1){
if(currentPage > 1){
pagination.innerHTML += `<a href="date.html?date=${date}&page=${currentPage - 1}">前へ</a>`;
}

for(let i=1;i<=totalPages;i++){
if(i === currentPage){
pagination.innerHTML += `<a class="current" href="date.html?date=${date}&page=${i}">${i}</a>`;
}else{
pagination.innerHTML += `<a href="date.html?date=${date}&page=${i}">${i}</a>`;
}
}

if(currentPage < totalPages){
pagination.innerHTML += `<a href="date.html?date=${date}&page=${currentPage + 1}">次へ</a>`;
}
}
});
</script>

</body>
</html>
