<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>趣味2号 裏部屋</title>

<style>
body{
    background:#0b0b0b;
    color:white;
    margin:0;
    font-family:sans-serif;
}

header{
    background:#000;
    text-align:center;
    padding:40px 20px;
    font-size:56px;
    font-weight:bold;
    border-bottom:2px solid #222;
}

.sub-title{
    text-align:center;
    color:#999;
    margin-top:15px;
    margin-bottom:40px;
    font-size:22px;
}

.gallery{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:30px;
    padding:20px 40px 80px;
}

.card{
    width:340px;
    background:#1b1b1b;
    border-radius:12px;
    overflow:hidden;
    transition:0.2s;
    box-shadow:0 0 12px rgba(0,0,0,0.5);
}

.card:hover{
    transform:scale(1.03);
}

.card-body{
    padding:35px 20px;
    text-align:center;
}

.date-title{
    font-size:42px;
    font-weight:bold;
    margin-bottom:15px;
}

.date-description{
    color:#999;
    font-size:20px;
}

footer{
    text-align:center;
    padding:40px;
    color:#666;
    border-top:1px solid #222;
}
</style>
</head>

<body>

<header>
趣味2号 裏部屋
</header>

<div class="sub-title">
煩悩ログ（日付管理）
</div>

<div class="gallery">

    <div class="card">
        <div class="card-body">
            <div class="date-title">
                2026-05-27
            </div>

            <div class="date-description">
                今日の煩悩ログ
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="date-title">
                2026-05-28
            </div>

            <div class="date-description">
                今日の煩悩ログ
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="date-title">
                2026-05-29
            </div>

            <div class="date-description">
                今日の煩悩ログ
            </div>
        </div>
    </div>

</div>

<footer>
趣味2号 裏部屋 © 2026
</footer>

</body>
</html>
