<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>趣味2号 裏部屋</title>

<style>
body{
background:#0b0b0b;
color:white;
margin:0;
font-family:sans-serif;
}

header{
background:#000;
text-align:center;
padding:40px 20px;
font-size:56px;
font-weight:bold;
border-bottom:2px solid #222;
}

.top-button-area{
text-align:center;
padding:20px;
background:#0b0b0b;
}

.top-button{
display:inline-block;
background:#222;
color:white;
text-decoration:none;
padding:12px 24px;
border-radius:10px;
font-size:20px;
}

.sub-title{
text-align:center;
color:#999;
font-size:22px;
margin:20px 0 40px;
}

.date-section{
max-width:1200px;
margin:0 auto 70px;
padding:0 30px;
}

.date-title{
font-size:38px;
font-weight:bold;
border-bottom:2px solid #333;
padding-bottom:12px;
margin-bottom:25px;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:26px;
}

.card{
background:#1b1b1b;
border-radius:12px;
overflow:hidden;
box-shadow:0 0 12px rgba(0,0,0,0.5);
}

.card img{
width:100%;
display:block;
}

.card-body{
padding:16px;
}

.card-title{
font-size:22px;
font-weight:bold;
margin-bottom:8px;
}

.card-date{
color:#999;
font-size:16px;
}

.pagination{
text-align:center;
padding:40px 20px 70px;
}

.pagination a{
display:inline-block;
background:#222;
color:white;
text-decoration:none;
padding:12px 20px;
margin:6px;
border-radius:8px;
font-size:20px;
}

.pagination .current{
background:#555;
}

footer{
text-align:center;
color:#666;
padding:40px;
border-top:1px solid #222;
}
</style>
</head>

<body id="top">

<header>
趣味2号 裏部屋
</header>

<div class="top-button-area">
<a class="top-button" href="index.html">
トップに戻る
</a>
</div>

<div class="sub-title">
煩悩ログ（日付スクロール型・50枚ごと）
</div>

<div id="content"></div>

<div class="pagination" id="pagination"></div>

<footer>
趣味2号 裏部屋 © 2026
</footer>

<script>
const PER_PAGE = 50;

const params = new URLSearchParams(window.location.search);
const currentPage = Number(params.get("page") || 1);

fetch("posts.json")
.then(response => response.json())
.then(posts => {

let allImages = [];

posts.forEach(post => {
    post.images.forEach((image,index) => {
        allImages.push({
            date: post.date,
            image: image,
            title: "今日の煩悩 " + (index + 1)
        });
    });
});

const totalPages = Math.ceil(allImages.length / PER_PAGE);

const start = (currentPage - 1) * PER_PAGE;
const end = start + PER_PAGE;
const pageImages = allImages.slice(start,end);

const grouped = {};

pageImages.forEach(item => {
    if(!grouped[item.date]){
        grouped[item.date] = [];
    }
    grouped[item.date].push(item);
});

const content = document.getElementById("content");

Object.keys(grouped).forEach(date => {

let section = document.createElement("section");
section.className = "date-section";

let title = document.createElement("div");
title.className = "date-title";
title.innerText = date + " 煩悩ログ";

let gallery = document.createElement("div");
gallery.className = "gallery";

grouped[date].forEach(item => {
    gallery.innerHTML += `
        <div class="card">
            <img src="${item.image}">
            <div class="card-body">
                <div class="card-title">${item.title}</div>
                <div class="card-date">${item.date}</div>
            </div>
        </div>
    `;
});

section.appendChild(title);
section.appendChild(gallery);
content.appendChild(section);

});

const pagination = document.getElementById("pagination");

if(totalPages > 1){

    if(currentPage > 1){
        pagination.innerHTML += `
            <a href="index.html?page=${currentPage - 1}">前へ</a>
        `;
    }

    for(let i = 1; i <= totalPages; i++){
        if(i === currentPage){
            pagination.innerHTML += `
                <a class="current" href="index.html?page=${i}">${i}</a>
            `;
        }else{
            pagination.innerHTML += `
                <a href="index.html?page=${i}">${i}</a>
            `;
        }
    }

    if(currentPage < totalPages){
        pagination.innerHTML += `
            <a href="index.html?page=${currentPage + 1}">次へ</a>
        `;
    }

}

});
</script>

</body>
</html>
