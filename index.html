<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>趣味2号 裏部屋</title>

<style>
body{
    background:#0b0b0b;
    color:white;
    margin:0;
    font-family:sans-serif;
}

header{
    background:#000;
    text-align:center;
    padding:40px 20px;
    font-size:56px;
    font-weight:bold;
    border-bottom:2px solid #222;
}

.sub-title{
    text-align:center;
    color:#999;
    margin-top:10px;
    margin-bottom:30px;
    font-size:18px;
}

.gallery{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:30px;
    padding:20px 40px 60px;
}

.card{
    width:320px;
    background:#1b1b1b;
    border-radius:12px;
    overflow:hidden;
    transition:0.2s;
    box-shadow:0 0 10px rgba(0,0,0,0.4);
}

.card:hover{
    transform:scale(1.02);
}

.card img{
    width:100%;
    height:430px;
    object-fit:cover;
    display:block;
}

.card-body{
    padding:20px;
}

.card-title{
    font-size:28px;
    font-weight:bold;
    margin-bottom:10px;
}

.card-tags{
    color:#999;
    margin-bottom:15px;
}

.card-description{
    color:#ddd;
    line-height:1.6;
}

footer{
    text-align:center;
    padding:40px;
    color:#666;
    border-top:1px solid #222;
}
</style>
</head>

<body>

<header>
趣味2号 裏部屋
</header>

<div class="sub-title">
AI画像・趣味保管庫
</div>

<div class="gallery">

    <div class="card">
        <img src="https://placehold.jp/500x700.png" alt="画像1">

        <div class="card-body">
            <div class="card-title">
                銀髪猫耳
            </div>

            <div class="card-tags">
                #銀髪 #猫耳 #AI画像
            </div>

            <div class="card-description">
                趣味保管用カテゴリー。
                今後ここに画像を追加予定。
            </div>
        </div>
    </div>

    <div class="card">
        <img src="https://placehold.jp/500x700.png" alt="画像2">

        <div class="card-body">
            <div class="card-title">
                夜系
            </div>

            <div class="card-tags">
                #夜 #青 #静かな圧
            </div>

            <div class="card-description">
                夜景、静かな空気感、
                青系の雰囲気画像保管用。
            </div>
        </div>
    </div>

    <div class="card">
        <img src="https://placehold.jp/500x700.png" alt="画像3">

        <div class="card-body">
            <div class="card-title">
                ホラー系
            </div>

            <div class="card-tags">
                #ホラー #語らない恐怖
            </div>

            <div class="card-description">
                不穏、怖い、
                語らない恐怖系画像保管。
            </div>
        </div>
    </div>

</div>

<footer>
趣味2号 裏部屋 © 2026
</footer>

</body>
</html>
