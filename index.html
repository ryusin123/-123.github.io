<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>趣味2号 裏部屋</title>

<style>
body{
background:#0b0b0b;
color:white;
margin:0;
font-family:sans-serif;
}

header{
background:#000;
text-align:center;
padding:40px;
font-size:56px;
font-weight:bold;
border-bottom:2px solid #222;
}

.sub-title{
text-align:center;
color:#999;
font-size:22px;
margin-top:20px;
margin-bottom:30px;
}

.gallery{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:30px;
padding:40px;
}

.card{
width:340px;
background:#1b1b1b;
border-radius:12px;
overflow:hidden;
transition:0.2s;
text-decoration:none;
display:block;
color:white;
box-shadow:0 0 12px rgba(0,0,0,0.4);
}

.card:hover{
transform:scale(1.03);
}

.card-body{
padding:35px;
text-align:center;
}

.date-title{
font-size:42px;
font-weight:bold;
margin-bottom:10px;
}

.date-description{
color:#999;
font-size:20px;
}
</style>
</head>

<body>

<header>
趣味2号 裏部屋
</header>

<div class="sub-title">
煩悩ログ（日付自動管理）
</div>

<div class="gallery" id="gallery">
</div>

<script>
fetch("posts.json")
.then(response => response.json())
.then(posts => {

const gallery = document.getElementById("gallery");

posts.forEach(post => {

gallery.innerHTML += `
<a class="card" href="date.html?date=${post.date}">
<div class="card-body">
<div class="date-title">
${post.date}
</div>

<div class="date-description">
${post.count}枚の煩悩
</div>
</div>
</a>
`;

});

});
</script>

</body>
</html>
